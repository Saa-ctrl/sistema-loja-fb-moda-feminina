<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Moda Feminina</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>FB Moda Feminina</h1>

    <h2>Cadastro de Produtos</h2>

    <label>Nome do produto:</label>
    <input type="text" id="nome">

    <br><br>

    <label>Preço:</label>
    <input type="number" id="preco">

    <br><br>

    <label>Tamanho:</label>
    <input type="text" id="tamanho">

    <br><br>

    <label>Cor:</label>
    <input type="text" id="cor">

    <br><br>

    <label>Quantidade:</label>
    <input type="number" id="quantidade">

    <br><br>

    <button onclick="cadastrarProduto()">Cadastrar Produto</button>

    <h2>Produtos cadastrados</h2>

    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Produto</th>
                <th>Preço</th>
                <th>Tamanho</th>
                <th>Cor</th>
                <th>Estoque</th>
            </tr>
        </thead>

        <tbody id="tabelaProdutos">
        </tbody>

    </table>
    <h2>Registrar Venda</h2>

<label>ID do produto:</label>
<input type="number" id="idVenda">

<br><br>

<label>Quantidade vendida:</label>
<input type="number" id="quantidadeVenda">

<br><br>

<button onclick="registrarVenda()">Registrar Venda</button>
<h2>Caixa</h2>

<table border="1">

    <thead>
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Total</th>
        </tr>
    </thead>

    <tbody id="tabelaVendas">
    </tbody>

</table>

<h3>Total vendido: R$ <span id="totalCaixa">0.00</span></h3>

    <script src="script.js"></script>

</body>

</html>
